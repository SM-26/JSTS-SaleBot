# Production stack for the deploy host. Pulls the image CI publishes to GHCR
# (see .github/workflows/publish-image.yml); nothing is built here.
# docker-compose.yaml stays the development setup.

# Same project name as the dev file, so the existing jsts-salebot_mongodb_data
# volume (and its posts and users) is reused.
name: jsts-salebot

services:
  bot:
    image: ghcr.io/sm-26/jsts-salebot:${BOT_TAG:-latest}
    container_name: jsts-salebot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Must be writable by UID 1000 (`node`): /config saves back to this file.
      - ./config.json:/app/config.json
      # Blocked-word list, re-read within ~60 s of an edit. A DIRECTORY, not a
      # file: editors that save by rename give a file a new inode, and a
      # single-file bind mount would keep showing the old one.
      - ./blocklist:/app/blocklist:ro
    environment:
      # Missing folder or file: the bot uses the list built into the image.
      - BLOCKED_WORDS_PATH=/app/blocklist/blockedWords.json
    depends_on:
      mongoserver:
        condition: service_healthy

  mongoserver:
    # Pinned to the major.minor the data was written with. `latest` jumped to
    # 9.0, and a major upgrade needs the featureCompatibilityVersion steps.
    image: mongo:8.2
    restart: always
    # Docker's default 10s is too short for mongod's shutdown checkpoint on
    # this host; on 2026-10-15 it was SIGKILLed mid-checkpoint.
    stop_grace_period: 60s
    command: [ "mongod", "--quiet" ]
    ports:
      # Host-only. Mongo has no auth, so never publish it on all interfaces.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Starts only on request: --profile tools up -d mongo-express
  mongo-express:
    image: mongo-express:latest
    profiles: [ "tools" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongoserver
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_URL=mongodb://mongoserver:27017
    depends_on:
      mongoserver:
        condition: service_healthy

volumes:
  mongodb_data:
