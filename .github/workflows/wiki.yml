name: Copy docs to the wiki

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Replaces the whole wiki with docs/, so edits made on the wiki are lost.
      - name: Copy docs/ to the wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5.0.6
        with:
          path: docs
          ignore: LICENSE.txt
          disable-empty-commits: true
